name: signcare_ai
description: "SignCare AI - Your Voice. Our Care. A communication app for deaf and non-speaking patients."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_tts: ^4.2.5
  http: ^1.6.0
  speech_to_text: ^7.4.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  intl: any
  share_plus: ^13.3.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/app_icon.png

flutter_launcher_icons:
  image_path: "assets/app_icon.png"
  android: true
  ios: true